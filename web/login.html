<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 企业终端管控平台</title>
  <link rel="stylesheet" href="/assets/css/base.css?v=ui9">
  <link rel="stylesheet" href="/assets/css/theme.css?v=ui8">
  <link rel="stylesheet" href="/assets/css/components.css?v=ui7">
  <link rel="stylesheet" href="/assets/css/login.css?v=ui4">
</head>
<body class="login-body">
  <div class="login-shell">
    <div class="login-brand">
      <div class="login-brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
      </div>
      <h1>企业终端<span class="accent">管控平台</span></h1>
      <p>设备管理 · 策略下发 · 合规运维，让每一台 PC 都在可控视野里。</p>
    </div>
    <form class="login-card" id="login-form" autocomplete="on">
      <h2>欢迎回来</h2>
      <p class="login-card-desc">登录后进入设备管理与策略运维工作台。</p>
      <div class="form-item">
        <label class="form-label">登录账号</label>
        <input class="form-input" name="username" id="username" placeholder="请输入账号" required autocomplete="username">
      </div>
      <div class="form-item">
        <label class="form-label">密码</label>
        <div class="password-field">
          <input class="form-input" type="password" name="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
          <button type="button" class="password-toggle" data-pwd-toggle aria-label="显示/隐藏密码" title="显示/隐藏密码">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <p class="login-error" id="login-error" hidden></p>
      <button class="btn btn-primary login-submit" type="submit" id="login-btn">登 录</button>
    </form>
  </div>
  <script src="/assets/js/data.js?v=ui5"></script>
  <script src="/assets/js/utils.js?v=a11"></script>
  <script src="/assets/js/api.js?v=a3"></script>
  <script>
    (function () {
      function homeHref(user) {
        const codes = (user && (user.menu_codes || (user.menus || []).map(m => m.code))) || [];
        return (window.MDM && typeof MDM.resolveHomeHref === 'function')
          ? MDM.resolveHomeHref(codes)
          : '/index.html';
      }

      if (MDMApi.getToken()) {
        location.replace(homeHref(MDMApi.getCachedUser()));
        return;
      }
      MDMUtils.bindPasswordToggles(document.getElementById('login-form'));
      const form = document.getElementById('login-form');
      const errEl = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errEl.hidden = true;
        btn.disabled = true;
        btn.textContent = '登录中...';
        try {
          const data = await MDMApi.login(
            document.getElementById('username').value.trim(),
            document.getElementById('password').value
          );
          location.href = homeHref(data && data.user);
        } catch (err) {
          errEl.textContent = err.message || '登录失败';
          errEl.hidden = false;
          btn.disabled = false;
          btn.textContent = '登 录';
        }
      });
    })();
  </script>
</body>
</html>
