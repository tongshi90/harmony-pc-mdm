<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MDM 设备模拟器</title>
  <link rel="stylesheet" href="/assets/sim.css">
</head>
<body>
  <div class="page">
    <header class="header">
      <div>
        <h1>MDM 设备模拟器</h1>
        <p class="sub" id="status-line">未连接 · 云侧 API 以状态接口为准</p>
      </div>
      <button type="button" class="btn danger" id="btn-exit" style="display:none">退出设备</button>
    </header>

    <section class="card" id="connect-panel">
      <h2>接入设备</h2>
      <p class="hint">输入 SN 后将使用云侧配置的 MQTT Broker，订阅 <code>mdm/{SN}/release</code>，并主动拉取策略。</p>
      <div class="row">
        <input class="input" id="sn-input" placeholder="设备 SN，如 DEMO-SN-001" maxlength="64" autocomplete="off">
        <button type="button" class="btn primary" id="btn-connect">确定连接</button>
      </div>
      <p class="err" id="connect-err" style="display:none"></p>
    </section>

    <section class="card" id="log-panel" style="display:none">
      <div class="log-head">
        <h2>操作记录</h2>
        <button type="button" class="btn" id="btn-refresh">刷新</button>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th style="width:160px">时间</th>
            <th style="width:90px">类型</th>
            <th>说明</th>
            <th style="width:220px">API</th>
            <th style="width:80px"></th>
          </tr>
        </thead>
        <tbody id="log-body">
          <tr><td colspan="5" class="mute">暂无记录</td></tr>
        </tbody>
      </table>
    </section>
  </div>

  <div class="mask" id="detail-mask">
    <div class="modal">
      <div class="modal-h">
        <strong id="detail-title">详情</strong>
        <button type="button" class="btn" id="detail-close">关闭</button>
      </div>
      <pre class="detail-pre" id="detail-body"></pre>
    </div>
  </div>

  <script src="/assets/sim.js"></script>
</body>
</html>
